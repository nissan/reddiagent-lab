apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: level-three-unsupported-live-rail
  description: Schema-valid Level 3 ADL that keeps authority explicit but names a live payment rail.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: true
    structuredOutput: true
conformance:
  requestedLevel: 3
harness:
  instructions:
    inline: "Prepare a bounded dry-run payment receipt and reputation signal."
  policies:
    - id: allow-payment-dry-run
      capability: payment
      subject: agent
      resource: x402:intent:review-fee
      action: spend
      effect: allow
      scope:
        type: task
      limits:
        maxUsd: "0.50"
        requireReceipt: true
      enforcement:
        target: policy-engine
        phase: before-execution
  evalGates:
    - id: payment-policy-check
      type: receipt-check
      rule: "Payment intents must bind to a policy and receipt before completion."
      required: true
      severity: error
      appliesTo:
        scope: receipt
      evidence:
        ref: trace:payment.policy.checked
        schema:
          type: object
      retryable: false
      onFailure:
        completion: block
        defaultStatus: fail
  runtime:
    target: local-python
  observability:
    events:
      - name: trace.started
        type: trace
        required: true
        evidenceRef: trace:trace.started
      - name: trace.completed
        type: trace
        required: true
        evidenceRef: trace:trace.completed
      - name: task.completed
        type: task
        required: true
        evidenceRef: trace:task.completed
      - name: task.failed
        type: task
        required: true
        evidenceRef: trace:task.failed
      - name: model.called
        type: model
        required: true
        evidenceRef: trace:model.called
      - name: policy.checked
        type: policy
        required: true
        evidenceRef: trace:policy.checked
      - name: eval.checked
        type: eval
        required: true
        evidenceRef: trace:eval.checked
      - name: payment.intent.created
        type: payment
        required: true
        evidenceRef: trace:payment.intent.created
      - name: receipt.emitted
        type: receipt
        required: true
        evidenceRef: receipt:review-fee
      - name: reputation.signal.emitted
        type: reputation
        required: true
        evidenceRef: trace:reputation.signal.emitted
    summaries:
      - id: payment_summary
        type: run-summary
        destinationRef: local_trace
        eventRefs:
          - trace.started
          - payment.intent.created
          - receipt.emitted
          - reputation.signal.emitted
        humanReadable: true
    destinations:
      - id: local_trace
        type: file
        mode: local-only
        ref: file://./traces/level-three-unsupported-live-rail.jsonl
        redaction:
          mode: payload-redacted
    evidenceRefs:
      - trace:trace.started
      - trace:payment.intent.created
      - receipt:review-fee
    retention:
      mode: ephemeral
      purgeOnCompletion: true
    redaction:
      mode: payload-redacted
    receipts:
      include: true
      eventRefs:
        - payment.intent.created
        - receipt.emitted
        - reputation.signal.emitted
      requiredEvidenceRefs:
        - receipt:review-fee
    exports:
      include: true
      eventRefs:
        - trace.started
        - trace.completed
extensions:
  x402:
    enabled: true
    intents:
      - id: review-fee
        direction: spend
        maxAmount: "0.50"
        currency: USD
        rails:
          - solana
        purpose: "Review fee for a bounded dry-run research task."
        scope:
          type: task
          value: review-fee
        authority:
          principal: user:review-requester
          spender: agent:level-three-unsupported-live-rail
          maxAmount: "0.50"
          currency: USD
          rails:
            - solana
          purpose: "Review fee for a bounded dry-run research task."
          scope:
            type: task
            value: review-fee
          expiresAt: "2026-12-31T23:59:59Z"
          revocation:
            mode: operator
            path: "ops://reviews/review-fee/revoke"
          audit:
            path: "trace://payment/review-fee"
            evidenceRef: trace:payment.intent.created
        requireReceipt: true
        receiptRef: review-fee-receipt
        policyRefs:
          - allow-payment-dry-run
  receipts:
    required: true
    refs:
      - id: review-fee-receipt
        intentRef: review-fee
        evidenceRef: receipt:review-fee
        policyRefs:
          - allow-payment-dry-run
  reputation:
    emitSignals:
      - taskCompleted
      - receiptVerified
    basis:
      - receipt
      - policy
    evidenceRefs:
      - receipt:review-fee
      - trace:reputation.signal.emitted
