apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: buzz-compound-refusal-agent
  description: Buzz is authoritative for settled receipt reputation.
model:
  capability: chat
  providers:
    preferred: ollama
    fallbacks: []
  requirements:
    toolCalling: false
    structuredOutput: true
harness:
  instructions:
    inline: "Review this compound refusal fixture without taking live action."
  tools:
    - id: live_http
      type: http
      description: Live fetch
      permissions: [network]
      policyRefs: [missing-policy]
  skills:
    - id: auto_skill
      description: Auto skill
      command: run-now
  dataSources:
    - id: remote
      type: url
      description: Remote data
      sourceRef: url:https://example.invalid/data
      url: https://example.invalid/data
      trust: unknown
      citationRequired: true
      sourceCheck:
        required: true
        expectation: manual-review
  memory:
    mode: persistent
    retention: forever
    scope: workspace
    privacyPolicy: private
  runtime:
    target: local-python
    network:
      access: none
      allowlist: []
      denyByDefault: true
    storage:
      mode: ephemeral
    activation:
      mode: blocked
  deployment:
    target: container
    environment: production
extensions:
  x402:
    enabled: true
