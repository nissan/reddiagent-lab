apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: level-four-missing-observability
  description: Schema-valid ADL that requests Level 4 but omits observability and recovery evidence fields.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: true
    structuredOutput: true
conformance:
  requestedLevel: 4
harness:
  instructions:
    inline: "Serve a production-style dry-run report only after readiness checks pass."
  policies:
    - id: production-policy-check
      capability: runtime
      subject: agent
      resource: hosted-container
      action: deploy
      effect: allow
      scope:
        type: project
      enforcement:
        target: human-review
        phase: compatibility
  evalGates:
    - id: deployment-readiness
      type: human-review
      rule: "Deployment readiness evidence must be reviewed before any live action."
      required: true
      severity: critical
      appliesTo:
        scope: task
      evidence:
        ref: trace:deployment.readiness.checked
        schema:
          type: object
      retryable: false
      onFailure:
        completion: block
        defaultStatus: fail
  runtime:
    target: hosted-container
  deployment:
    environment: staging
extensions: {}
