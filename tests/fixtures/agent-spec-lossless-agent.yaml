apiVersion: reddiagent.dev/v0.1
kind: Agent
metadata:
  name: lossless-agent-spec-review-agent
  description: Minimal local agent used to prove strict Agent Spec export can emit when no Reddi semantics are lost.
model:
  capability: chat
  providers:
    preferred: openai
    fallbacks: []
  requirements:
    toolCalling: false
    structuredOutput: true
harness:
  instructions:
    inline: "Answer directly without external tools."
  runtime:
    target: local-python
extensions: {}
