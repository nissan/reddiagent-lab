apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: buzz-static-review-agent
  description: Reviewed local static persona projection fixture.
model:
  capability: chat
  providers:
    preferred: ollama
    fallbacks: []
  requirements:
    toolCalling: false
    structuredOutput: true
harness:
  instructions:
    inline: "Summarize only the reviewed public input without taking live action."
  runtime:
    target: local-python
    network:
      access: none
      allowlist: []
      denyByDefault: true
    storage:
      mode: ephemeral
    activation:
      mode: blocked
extensions: {}
