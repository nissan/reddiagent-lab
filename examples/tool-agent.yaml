apiVersion: reddiagent.dev/v0.1
kind: Agent
metadata:
  name: source-checker
  description: Answers questions using one approved search tool and cites the source title.
model:
  capability: chat
  providers:
    preferred: anthropic
    fallbacks:
      - openai
      - gemini
  requirements:
    toolCalling: true
    structuredOutput: true
harness:
  instructions:
    inline: "Use the search_docs tool before answering factual questions. Cite source titles."
  tools:
    - id: search_docs
      type: function
      description: Search approved documentation sources.
      inputSchema:
        type: object
        properties:
          query:
            type: string
        required:
          - query
      outputSchema:
        type: object
        properties:
          title:
            type: string
          url:
            type: string
          snippet:
            type: string
  policies:
    - id: approved-sources-only
      type: data-access
      rule: "Tool may only search configured approved documentation sources."
  evalGates:
    - id: cite-source
      type: output-check
      rule: "Answer must include at least one source title."
  runtime:
    target: local-python
extensions: {}

