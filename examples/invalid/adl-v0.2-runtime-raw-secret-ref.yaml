apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: runtime-raw-secret-ref
  description: Invalid runtime descriptor that places obvious raw secret material in ref.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: true
    structuredOutput: true
harness:
  instructions:
    inline: "This fixture must fail before compatibility reporting."
  runtime:
    target: hosted-container
    network:
      access: none
      allowlist: []
      denyByDefault: true
    secretRefs:
      - name: EXAMPLE_API_KEY
        provider: env
        ref: sk-live-do-not-accept
        required: true
    storage:
      mode: ephemeral
    scheduler:
      trigger: manual
  evalGates:
    - id: no-secret-ref-values
      type: output-check
      rule: "Secret ref fields must not contain obvious raw credential values."
      required: true
      severity: error
      appliesTo:
        scope: task
      evidence:
        ref: trace:secret.ref.checked
        schema:
          type: object
      retryable: false
      onFailure:
        completion: block
        defaultStatus: fail
extensions: {}
