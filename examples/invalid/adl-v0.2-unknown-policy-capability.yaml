apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: unknown-policy-capability
  description: Declares an unknown policy capability.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: false
    structuredOutput: true
harness:
  instructions:
    inline: "Do not execute."
  policies:
    - id: allow-browser
      capability: browser
      subject: agent
      resource: external-web
      action: browse
      effect: allow
      scope:
        type: task
      enforcement:
        target: static-validator
        phase: compatibility
  runtime:
    target: local-python
extensions: {}
