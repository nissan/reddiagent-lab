apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: human-approval-not-required
  description: Declares human approval while making approval optional.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: false
    structuredOutput: true
harness:
  instructions:
    inline: "Do not execute."
  policies:
    - id: optional-human-approval
      capability: human-approval
      subject: operator
      resource: external-action
      action: approve
      effect: allow
      scope:
        type: task
      approval:
        required: false
        mode: human
      enforcement:
        target: human-review
        phase: before-execution
  runtime:
    target: local-python
extensions: {}
