apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: runtime-embedded-secret
  description: Invalid runtime descriptor that embeds a live secret value.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: true
    structuredOutput: true
harness:
  instructions:
    inline: "This fixture must fail before compatibility reporting."
  runtime:
    target: hosted-container
    network:
      access: egress
      allowlist:
        - https://api.example.test
      denyByDefault: true
    secretRefs:
      - name: EXAMPLE_API_KEY
        provider: env
        value: sk-live-do-not-accept
    storage:
      mode: ephemeral
    scheduler:
      trigger: manual
  evalGates:
    - id: no-secret-values
      type: output-check
      rule: "Secret refs must not embed values."
      required: true
      severity: error
      appliesTo:
        scope: task
      evidence:
        ref: trace:secret.ref.checked
        schema:
          type: object
      retryable: false
      onFailure:
        completion: block
        defaultStatus: fail
extensions: {}
