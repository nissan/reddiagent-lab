apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: warning-gate-blocking
  description: Invalid warning gate with blocking completion behavior.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: false
    structuredOutput: true
harness:
  instructions:
    inline: "Return a deterministic answer."
  evalGates:
    - id: optional-style-check
      type: output-check
      rule: "Output should include a preferred style note."
      required: false
      severity: error
      appliesTo:
        scope: output
      evidence:
        ref: trace:output.style_checked
        schema:
          type: object
      retryable: true
      onFailure:
        completion: block
        defaultStatus: pass
  runtime:
    target: local-python
