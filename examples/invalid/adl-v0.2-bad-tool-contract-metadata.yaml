apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: bad-tool-contract-metadata
  description: Uses unsupported tool contract metadata values.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: true
    structuredOutput: true
harness:
  instructions:
    inline: "Do not execute."
  tools:
    - id: bad_metadata
      type: function
      description: Invalid metadata fixture.
      permissions:
        - teleport
      sideEffects:
        mode: invisible
      timeout:
        seconds: 0
        behavior: ignore
      retryPolicy:
        maxAttempts: 11
        backoff: random
      auditLevel: everything
  runtime:
    target: local-python
extensions: {}
