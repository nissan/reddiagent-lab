apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: tool-missing-policy-ref
  description: Declares a risky tool without a matching policy reference.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: true
    structuredOutput: true
harness:
  instructions:
    inline: "Do not execute."
  tools:
    - id: send_summary
      type: http
      description: Send a summary externally.
      policyRefs:
        - missing-policy
  policies:
    - id: allow-reviewed-tool
      capability: tool
      subject: agent
      resource: tool:search_docs
      action: invoke
      effect: allow
      scope:
        type: task
      enforcement:
        target: runtime-adapter
        phase: before-execution
  runtime:
    target: local-python
extensions: {}
