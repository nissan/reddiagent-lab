apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: unenforceable-policy
  description: Declares a network policy with an unsupported enforcement target.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: false
    structuredOutput: true
harness:
  instructions:
    inline: "Do not execute."
  policies:
    - id: allow-network-best-effort
      capability: network
      subject: agent
      resource: https://example.com
      action: fetch
      effect: allow
      scope:
        type: task
      enforcement:
        target: best-effort-note
        phase: before-execution
  runtime:
    target: local-python
extensions: {}
