apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: duplicate-tool-id
  description: Reuses a tool id across harness tool declarations.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: true
    structuredOutput: true
harness:
  instructions:
    inline: "Do not execute."
  tools:
    - id: duplicate_tool
      type: function
      description: First safe fixture.
      permissions:
        - tool
      sideEffects:
        mode: none
      timeout:
        seconds: 5
      retryPolicy:
        maxAttempts: 0
      auditLevel: metadata
    - id: duplicate_tool
      type: function
      description: Second safe fixture with the same id.
      permissions:
        - tool
      sideEffects:
        mode: none
      timeout:
        seconds: 5
      retryPolicy:
        maxAttempts: 0
      auditLevel: metadata
  runtime:
    target: local-python
extensions: {}
