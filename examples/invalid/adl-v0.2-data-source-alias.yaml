apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: data-source-alias
  description: Uses ADL v0.1 data source aliases that v0.2 rejects.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: false
    structuredOutput: true
harness:
  instructions:
    inline: "Do not execute."
  dataSources:
    - id: legacy_document
      type: document
      description: Legacy document alias should be rewritten to file.
      sourceRef: file:specs/ADL-v0.2.md
      path: specs/ADL-v0.2.md
      trust: approved
      citationRequired: true
      sourceCheck:
        required: true
        expectation: approved-source
  runtime:
    target: local-python
extensions: {}
