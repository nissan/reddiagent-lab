apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: missing-observability-events
  description: Schema-valid Level 4 ADL missing required observability event minimums.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: true
    structuredOutput: true
conformance:
  requestedLevel: 4
harness:
  instructions:
    inline: "Prepare a deployment readiness report without runtime activation."
  policies:
    - id: deployment-review
      capability: runtime
      subject: operator
      resource: hosted-container
      action: review
      effect: allow
      scope:
        type: project
      enforcement:
        target: human-review
        phase: compatibility
  evalGates:
    - id: deployment-readiness
      type: human-review
      rule: "Deployment readiness evidence must be reviewed."
      required: true
      severity: critical
      appliesTo:
        scope: task
      evidence:
        ref: trace:deployment.readiness
        schema:
          type: object
      retryable: false
      onFailure:
        completion: block
        defaultStatus: fail
  runtime:
    target: hosted-container
  deployment:
    environment: staging
    rollback:
      mode: operator-reviewed
  observability:
    events:
      - name: trace.started
        type: trace
        required: true
        evidenceRef: trace:trace.started
    summaries:
      - id: incomplete_summary
        type: deployment-readiness-summary
        destinationRef: local_trace
        eventRefs:
          - trace.started
        humanReadable: true
    destinations:
      - id: local_trace
        type: file
        mode: local-only
        ref: file://./traces/missing-observability-events.jsonl
        redaction:
          mode: payload-redacted
    retention:
      mode: ephemeral
      purgeOnCompletion: true
    redaction:
      mode: payload-redacted
    receipts:
      include: true
      eventRefs: []
    exports:
      include: true
      eventRefs:
        - trace.started
  recovery:
    disable:
      mode: operator-reviewed
extensions:
  x402:
    enabled: true
    intents:
      - id: readiness-fee
        direction: charge
        maxAmount: "0.00"
        currency: USD
        rails:
          - dry-run
        requireReceipt: true
        policyRefs:
          - deployment-review
  receipts:
    required: true
  reputation:
    emitSignals:
      - deployment-readiness-reviewed
