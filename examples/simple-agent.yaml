apiVersion: reddiagent.dev/v0.1
kind: Agent
metadata:
  name: simple-research-helper
  description: Answers a user question using only model reasoning and a session log.
model:
  capability: chat
  providers:
    preferred: openai
    fallbacks:
      - anthropic
      - gemini
      - ollama
  requirements:
    toolCalling: false
    structuredOutput: true
harness:
  instructions:
    inline: "Answer clearly. Say when you are uncertain. Do not use external tools."
  memory:
    mode: session
  policies:
    - id: no-external-actions
      type: permission
      rule: "The agent may not send messages, spend money, browse, or modify files."
  evalGates:
    - id: has-answer
      type: output-check
      rule: "Response must include an answer or a clear uncertainty statement."
  runtime:
    target: local-python
extensions: {}

