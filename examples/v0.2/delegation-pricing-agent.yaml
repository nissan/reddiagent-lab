apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: delegated-pricing-analyst
  description: >-
    Paid-delegation SERVICE example (seller side). Other agents discover this
    analyst and pay it to produce one bounded pricing and cost-intelligence
    report. The single x402 intent uses direction=charge on the x402-dry-run
    rail only, with a full charge authority contract, a policy-engine-enforced
    charge policy, receipt binding, and reputation signals. Live rails stay
    unsupported (paymentAccess=false).
model:
  capability: chat
  providers:
    preferred: openai
    fallbacks:
      - anthropic
  requirements:
    toolCalling: true
    structuredOutput: true
conformance:
  requestedLevel: 3
  evidenceRefs:
    - "receipt:charge-pricing-report"
harness:
  instructions:
    inline: >-
      Deliver one bounded pricing report to the paying delegating agent: every
      figure carries its source and a confidence level, confirmed numbers are
      clearly separated from estimates, and free-tier limits and gotchas are
      stated explicitly. When pricing sits behind a sales wall the answer is
      "price unknown, requires sales contact", never a guess dressed as a
      range. This service is advisory only - it researches and estimates but
      never signs up, provisions, or spends on the client's behalf. Charge at
      most the declared fee on the x402-dry-run rail, only after operator
      approval, and emit receipt metadata for every charge.
  tools:
    - id: read_pricing_fixtures
      type: function
      description: Read curated pricing fixture data for the delegated cost report.
      permissions:
        - tool
      sideEffects:
        mode: none
        mutatesState: false
        external: false
      timeout:
        seconds: 30
        behavior: fail-closed
      retryPolicy:
        maxAttempts: 2
        backoff: none
      auditLevel: event
      policyRefs:
        - allow-pricing-tool
  policies:
    - id: allow-pricing-tool
      capability: tool
      subject: agent
      resource: tool:read_pricing_fixtures
      action: invoke
      effect: allow
      scope:
        type: task
      limits:
        maxCalls: 5
      approval:
        required: false
        mode: none
      enforcement:
        target: runtime-adapter
        phase: before-execution
        targetRef: tool:read_pricing_fixtures
    - id: allow-pricing-charge
      capability: payment
      subject: agent
      resource: x402:intent:charge-pricing-report
      action: charge
      effect: allow
      scope:
        type: task
        value: charge-pricing-report
      limits:
        currency: USDC
        maxAmount: "0.15"
        requireReceipt: true
      approval:
        required: true
        mode: human
        threshold: "any charge"
        approver: operator
      enforcement:
        target: policy-engine
        phase: before-execution
        targetRef: x402:intent:charge-pricing-report
    - id: require-charge-approval
      capability: human-approval
      subject: operator
      resource: x402:intent:charge-pricing-report
      action: approve
      effect: allow
      scope:
        type: task
      limits:
        requiredFor:
          - payment
      approval:
        required: true
        mode: human
        threshold: "any charge intent"
        approver: operator
      enforcement:
        target: human-review
        phase: before-execution
  evalGates:
    - id: pricing-charge-receipt-required
      type: receipt-check
      rule: "A verifiable charge receipt must be emitted before completion."
      required: true
      severity: critical
      appliesTo:
        scope: receipt
        targetRef: extensions.receipts.refs
      evidence:
        ref: "receipt:charge-pricing-report"
        schema:
          type: object
          required:
            - status
          properties:
            status:
              enum:
                - pass
                - fail
      retryable: false
      onFailure:
        completion: block
        defaultStatus: fail
        visibility: trace-and-receipt
    - id: pricing-charge-budget-check
      type: budget-check
      rule: "Total task charge must be less than or equal to 0.15 USDC."
      required: true
      severity: critical
      appliesTo:
        scope: budget
        targetRef: x402:intent:charge-pricing-report
      evidence:
        ref: "trace:payment.budget.checked"
        schema:
          type: object
          required:
            - status
          properties:
            status:
              enum:
                - pass
                - fail
      retryable: false
      onFailure:
        completion: block
        defaultStatus: fail
        visibility: trace-and-receipt
  runtime:
    target: local-python
    network:
      access: none
      allowlist: []
      denyByDefault: true
    storage:
      mode: ephemeral
    scheduler:
      trigger: manual
    activation:
      mode: blocked
    constraints:
      runtimeVersion: "python3.14"
      maxDurationSeconds: 120
  deployment:
    target: local
    environment: local
    rollback:
      mode: none
  observability:
    events:
      - name: trace.started
        type: trace
        required: true
        evidenceRef: "trace:trace.started"
        scope: task
      - name: trace.completed
        type: trace
        required: true
        evidenceRef: "trace:trace.completed"
        scope: task
      - name: task.completed
        type: task
        required: true
        evidenceRef: "trace:task.completed"
        scope: task
      - name: task.failed
        type: task
        required: true
        evidenceRef: "trace:task.failed"
        scope: task
      - name: model.called
        type: model
        required: true
        evidenceRef: "trace:model.called"
        scope: task
      - name: policy.checked
        type: policy
        required: true
        evidenceRef: "trace:policy.checked"
        scope: task
      - name: eval.checked
        type: eval
        required: true
        evidenceRef: "trace:eval.checked"
        scope: task
      - name: payment.intent.created
        type: payment
        required: true
        evidenceRef: "trace:payment.intent.created"
        scope: task
        receiptRef: charge-pricing-report-receipt
      - name: receipt.emitted
        type: receipt
        required: true
        evidenceRef: "receipt:charge-pricing-report"
        scope: receipt
        receiptRef: charge-pricing-report-receipt
      - name: reputation.signal.emitted
        type: reputation
        required: true
        evidenceRef: "trace:reputation.signal.emitted"
        scope: task
    summaries:
      - id: delegation_charge_run_summary
        type: run-summary
        destinationRef: local_trace_file
        eventRefs:
          - trace.started
          - trace.completed
          - task.completed
          - task.failed
          - payment.intent.created
          - receipt.emitted
          - reputation.signal.emitted
        humanReadable: true
    destinations:
      - id: local_trace_file
        type: file
        mode: local-only
        ref: "file://./traces/delegation-pricing-agent.jsonl"
        redaction:
          mode: payload-redacted
          fields:
            - prompt
            - output
    evidenceRefs:
      - "trace:payment.intent.created"
      - "receipt:charge-pricing-report"
      - "trace:reputation.signal.emitted"
    traceRef: "trace:delegated-pricing-analyst"
    retention:
      mode: ephemeral
      purgeOnCompletion: true
    redaction:
      mode: payload-redacted
      fields:
        - prompt
        - output
    receipts:
      include: true
      eventRefs:
        - payment.intent.created
        - receipt.emitted
      requiredEvidenceRefs:
        - "receipt:charge-pricing-report"
    exports:
      include: true
      eventRefs:
        - trace.started
        - trace.completed
        - payment.intent.created
        - receipt.emitted
      requiredEvidenceRefs:
        - "receipt:charge-pricing-report"
  recovery:
    disable:
      mode: manual
extensions:
  x402:
    enabled: true
    intents:
      - id: charge-pricing-report
        direction: charge
        maxAmount: "0.15"
        currency: USDC
        rails:
          - x402-dry-run
        purpose: >-
          Charge a delegating client agent for one bounded dry-run pricing
          report with sourced, confidence-graded figures.
        scope:
          type: task
          value: charge-pricing-report
        authority:
          principal: "user:service-operator"
          spender: "agent:delegating-client"
          maxAmount: "0.15"
          currency: USDC
          rails:
            - x402-dry-run
          purpose: >-
            Charge a delegating client agent for one bounded dry-run pricing
            report with sourced, confidence-graded figures.
          scope:
            type: task
            value: charge-pricing-report
          expiresAt: "2026-12-31T23:59:59Z"
          revocation:
            mode: operator
            path: "ops://payments/charge-pricing-report/revoke"
          audit:
            path: "trace://payment/charge-pricing-report"
            evidenceRef: "receipt:charge-pricing-report"
        requireReceipt: true
        receiptRef: charge-pricing-report-receipt
        policyRefs:
          - allow-pricing-charge
  receipts:
    required: true
    refs:
      - id: charge-pricing-report-receipt
        intentRef: charge-pricing-report
        evidenceRef: "receipt:charge-pricing-report"
        policyRefs:
          - allow-pricing-charge
  reputation:
    emitSignals:
      - taskCompleted
      - evalPassed
      - receiptVerified
    basis:
      - eval
      - receipt
      - policy
    evidenceRefs:
      - "receipt:charge-pricing-report"
