apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: runtime-platform-native-agent
  description: Platform-native descriptor with deployment-only constraints for static review.
model:
  capability: chat
  providers:
    preferred: openai
    fallbacks:
      - gemini
  requirements:
    toolCalling: true
    structuredOutput: true
conformance:
  requestedLevel: 4
harness:
  instructions:
    inline: "Prepare a platform-native deployment review without invoking platform APIs."
  policies:
    - id: platform-native-runtime-review
      capability: runtime
      subject: operator
      resource: platform-native
      action: review
      effect: allow
      scope:
        type: project
      enforcement:
        target: human-review
        phase: compatibility
  evalGates:
    - id: platform-native-readiness
      type: human-review
      rule: "Platform-native readiness evidence must be reviewed."
      required: true
      severity: critical
      appliesTo:
        scope: task
      evidence:
        ref: trace:platform_native.readiness
        schema:
          type: object
      retryable: false
      onFailure:
        completion: block
        defaultStatus: fail
  runtime:
    target: platform-native
    network:
      access: none
      allowlist: []
      denyByDefault: true
    storage:
      mode: ephemeral
    scheduler:
      trigger: manual
    activation:
      mode: approval-required
    constraints:
      region: us-west1
      maxDurationSeconds: 120
      maxConcurrency: 1
  deployment:
    target: platform-native
    environment: staging
    networkPolicy:
      access: egress
      allowlist:
        - https://api.example.test
      denyByDefault: true
    storage:
      mode: external
      refs:
        - platform://state-store
      retention: "24h"
    scheduler:
      trigger: cron
      schedule: "*/30 * * * *"
      timezone: UTC
    rollback:
      mode: operator-reviewed
      requiresApproval: true
    healthCheck:
      type: trace-event
      ref: trace:platform_native.health.checked
  observability:
    events:
      - name: trace.started
        type: trace
        required: true
        evidenceRef: trace:trace.started
        scope: deployment
      - name: trace.completed
        type: trace
        required: true
        evidenceRef: trace:trace.completed
        scope: deployment
      - name: task.completed
        type: task
        required: true
        evidenceRef: trace:task.completed
        scope: task
      - name: task.failed
        type: task
        required: true
        evidenceRef: trace:task.failed
        scope: task
      - name: model.called
        type: model
        required: true
        evidenceRef: trace:model.called
        scope: task
      - name: policy.checked
        type: policy
        required: true
        evidenceRef: trace:policy.checked
        scope: task
      - name: eval.checked
        type: eval
        required: true
        evidenceRef: trace:eval.checked
        scope: task
      - name: payment.intent.created
        type: payment
        required: true
        evidenceRef: trace:payment.intent.created
        scope: receipt
      - name: receipt.emitted
        type: receipt
        required: true
        evidenceRef: receipt:platform-native-readiness-fee
        scope: receipt
      - name: reputation.signal.emitted
        type: reputation
        required: true
        evidenceRef: trace:reputation.signal.emitted
        scope: receipt
      - name: deployment.health.checked
        type: deployment
        required: true
        evidenceRef: trace:platform_native.health.checked
        scope: deployment
      - name: adapter.loss.reported
        type: adapter
        required: true
        evidenceRef: export:adapter-loss
        scope: export
    summaries:
      - id: platform_native_readiness_summary
        type: deployment-readiness-summary
        destinationRef: platform_native_trace
        eventRefs:
          - trace.started
          - deployment.health.checked
          - adapter.loss.reported
        humanReadable: true
      - id: adapter_loss_summary
        type: adapter-loss-summary
        destinationRef: platform_native_trace
        eventRefs:
          - adapter.loss.reported
        humanReadable: true
    destinations:
      - id: platform_native_trace
        type: openclaw-trace
        mode: adapter-managed
        ref: trace://runtime-platform-native
        redaction:
          mode: payload-redacted
          fields:
            - prompt
            - secretRefs
    evidenceRefs:
      - trace:trace.started
      - trace:platform_native.health.checked
      - export:adapter-loss
      - receipt:platform-native-readiness-fee
    traceRef: trace:runtime-platform-native-agent
    retention:
      mode: time-bound
      maxAge: "7d"
      storageRef: trace://runtime-platform-native
      purgeOnCompletion: false
    redaction:
      mode: payload-redacted
      fields:
        - prompt
        - secretRefs
    receipts:
      include: true
      eventRefs:
        - payment.intent.created
        - receipt.emitted
        - reputation.signal.emitted
      requiredEvidenceRefs:
        - receipt:platform-native-readiness-fee
    exports:
      include: true
      eventRefs:
        - adapter.loss.reported
        - deployment.health.checked
      requiredEvidenceRefs:
        - export:adapter-loss
  recovery:
    disable:
      mode: operator-reviewed
      ref: runbook://disable-platform-native
      requiresApproval: true
extensions:
  x402:
    enabled: true
    intents:
      - id: platform-native-readiness-fee
        direction: charge
        maxAmount: "0.00"
        currency: USD
        rails:
          - x402-dry-run
        requireReceipt: true
        policyRefs:
          - platform-native-runtime-review
  receipts:
    required: true
    refs:
      - id: platform-native-readiness-fee-receipt
        intentRef: platform-native-readiness-fee
        evidenceRef: receipt:platform-native-readiness-fee
        policyRefs:
          - platform-native-runtime-review
  reputation:
    emitSignals:
      - policyCompliant
    basis:
      - receipt
      - policy
    evidenceRefs:
      - receipt:platform-native-readiness-fee
