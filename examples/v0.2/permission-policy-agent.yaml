apiVersion: reddiagent.dev/v0.2
kind: Agent
metadata:
  name: permission-policy-helper
  description: Demonstrates structured capability policies for risky agent capabilities.
model:
  capability: chat
  providers:
    preferred: openai
  requirements:
    toolCalling: true
    structuredOutput: true
harness:
  instructions:
    inline: "Use only declared capabilities and stop when approval is required."
  tools:
    - id: search_docs
      type: function
      description: Search reviewed project documents.
      policyRefs:
        - allow-reviewed-tool
    - id: send_summary
      type: http
      capability: messaging
      resource: channel:review-updates
      action: send
      description: Send a summary to an approved webhook.
      policyRefs:
        - allow-approved-messaging
        - require-human-approval
  policies:
    - id: allow-reviewed-tool
      capability: tool
      subject: agent
      resource: tool:search_docs
      action: invoke
      effect: allow
      scope:
        type: task
      limits:
        maxCalls: 5
      approval:
        required: false
        mode: none
      enforcement:
        target: runtime-adapter
        phase: before-execution
        targetRef: tool:search_docs
    - id: allow-doc-network
      capability: network
      subject: agent
      resource: https://docs.reddiagent.dev
      action: fetch
      effect: allow
      scope:
        type: resource
        value: docs.reddiagent.dev
      limits:
        allowedDomains:
          - docs.reddiagent.dev
      approval:
        required: false
        mode: none
      enforcement:
        target: runtime-adapter
        phase: before-execution
    - id: allow-workspace-read
      capability: filesystem
      subject: agent
      resource: ./docs
      action: read
      effect: allow
      scope:
        type: project
      limits:
        access: read-only
      approval:
        required: false
        mode: none
      enforcement:
        target: static-validator
        phase: compatibility
    - id: allow-payment-dry-run
      capability: payment
      subject: agent
      resource: x402:intent:review-fee
      action: spend
      effect: allow
      scope:
        type: task
      limits:
        maxUsd: "0.50"
        requireReceipt: true
      approval:
        required: true
        mode: human
        threshold: "any spend"
        approver: operator
      enforcement:
        target: policy-engine
        phase: before-execution
    - id: allow-approved-messaging
      capability: messaging
      subject: agent
      resource: channel:review-updates
      action: send
      effect: allow
      scope:
        type: task
      limits:
        maxMessages: 1
      approval:
        required: true
        mode: human
        threshold: "external send"
        approver: operator
      enforcement:
        target: runtime-adapter
        phase: before-execution
        targetRef: tool:send_summary
    - id: require-human-approval
      capability: human-approval
      subject: operator
      resource: external-action
      action: approve
      effect: allow
      scope:
        type: task
      limits:
        requiredFor:
          - payment
          - messaging
      approval:
        required: true
        mode: human
        threshold: "payment or external message"
        approver: operator
      enforcement:
        target: human-review
        phase: before-execution
  evalGates:
    - id: capability-policy-check
      type: tool-check
      rule: "Every risky capability must reference a matching policy before execution."
      required: true
      severity: critical
      appliesTo:
        scope: tool
        targetRef: harness.tools
      evidence:
        ref: trace:policy.capability.checked
        schema:
          type: object
          required:
            - status
          properties:
            status:
              enum:
                - pass
                - fail
      retryable: false
      onFailure:
        completion: block
        defaultStatus: fail
        visibility: trace-and-receipt
  runtime:
    target: local-python
extensions:
  x402:
    enabled: true
    intents:
      - id: review-fee
        direction: spend
        maxAmount: "0.50"
        currency: USD
        rails:
          - x402-dry-run
        requireReceipt: true
        policyRefs:
          - allow-payment-dry-run
