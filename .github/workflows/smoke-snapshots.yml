name: Smoke and Snapshots

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deterministic-smoke:
    name: Deterministic smoke and snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts and tests
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Validate examples
        run: python scripts/validate_examples.py

      - name: Check deterministic snapshots
        run: python tests/test_snapshots.py

      - name: Run report-only smoke validation
        env:
          PYTHON: python
        run: bash tests/smoke-validation.sh

