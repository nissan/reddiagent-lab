<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReddiAgent ADL Validation Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202a;
      --muted: #5d6876;
      --line: #d6dde6;
      --panel: #f7f9fb;
      --ok: #0f7b55;
      --warn: #a54700;
      --fail: #b42318;
      --blue: #1f5eff;
      --gold: #f2b84b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #ffffff;
    }
    header {
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 700; }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      min-height: calc(100vh - 73px);
    }
    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 18px;
    }
    section { padding: 18px 20px; min-width: 0; }
    .control-group { display: grid; gap: 10px; margin-bottom: 18px; }
    .segmented {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .segmented button {
      border: 0;
      border-right: 1px solid var(--line);
      background: #fff;
      padding: 9px 10px;
      font: inherit;
      cursor: pointer;
    }
    .segmented button:last-child { border-right: 0; }
    .segmented button[aria-pressed="true"] {
      color: #fff;
      background: var(--blue);
    }
    label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    select, textarea, button.primary {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    select, button.primary { min-height: 40px; padding: 8px 10px; }
    textarea {
      min-height: 440px;
      resize: vertical;
      padding: 12px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button.primary {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
      cursor: pointer;
      font-weight: 700;
    }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: #fff;
    }
    .status.pass { color: var(--ok); border-color: #9bd6bf; }
    .status.fail { color: var(--fail); border-color: #f0a7a2; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 70px;
    }
    .metric strong { display: block; font-size: 18px; }
    .metric span { color: var(--muted); font-size: 12px; }
    .results {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .finding {
      border: 1px solid var(--line);
      border-left: 4px solid var(--gold);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }
    .finding.fail { border-left-color: var(--fail); }
    .finding h3 { margin: 0 0 6px; font-size: 14px; }
    .finding p { margin: 4px 0; color: var(--muted); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #eef2f7;
      padding: 1px 4px;
      border-radius: 4px;
    }
    .guardrails {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .guardrails div {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      color: var(--muted);
    }
    .muted { color: var(--muted); }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .grid, .guardrails { grid-template-columns: 1fr; }
      textarea { min-height: 320px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ADL Validation Prototype</h1>
    <span class="status" id="mode-status">Local static UI</span>
  </header>
  <main>
    <aside>
      <div class="control-group">
        <label>Input mode</label>
        <div class="segmented" role="group" aria-label="Input mode">
          <button id="mode-example" type="button" aria-pressed="true">Bundled</button>
          <button id="mode-paste" type="button" aria-pressed="false">Pasted</button>
        </div>
      </div>
      <div class="control-group" id="example-controls">
        <label for="example-select">Bundled example</label>
        <select id="example-select"></select>
      </div>
      <div class="control-group">
        <label for="adl-input">ADL YAML</label>
        <textarea id="adl-input" spellcheck="false"></textarea>
      </div>
      <button class="primary" id="validate-button" type="button">Validate ADL</button>
      <p class="muted">Authoritative local command: <code>python3 scripts/validate_examples.py --format json &lt;adl-path&gt;</code></p>
    </aside>
    <section>
      <div class="summary">
        <span class="status" id="validation-status">Not run</span>
        <span class="muted" id="source-label"></span>
      </div>
      <div class="grid">
        <div class="metric"><strong id="error-count">0</strong><span>validation findings</span></div>
        <div class="metric"><strong id="runtime-flag">false</strong><span>runtime execution allowed</span></div>
        <div class="metric"><strong id="network-flag">false</strong><span>network access</span></div>
      </div>
      <div class="guardrails" id="guardrails"></div>
      <div class="results" id="results"></div>
    </section>
  </main>
  <script id="adl-ui-manifest" type="application/json">{
  &quot;generatedBy&quot;: &quot;scripts/adl_validation_ui.py&quot;,
  &quot;schema&quot;: &quot;specs/ADL-v0.1.schema.json&quot;,
  &quot;authoritativeCommand&quot;: &quot;python3 scripts/validate_examples.py --format json &lt;adl-path&gt;&quot;,
  &quot;guardrails&quot;: {
    &quot;localPrototypeOnly&quot;: true,
    &quot;runtimeExecutionAllowed&quot;: false,
    &quot;networkAccess&quot;: false,
    &quot;providerCalls&quot;: false,
    &quot;mcpInvocation&quot;: false,
    &quot;paymentAccess&quot;: false,
    &quot;credentialAccess&quot;: false,
    &quot;deploymentAllowed&quot;: false
  },
  &quot;examples&quot;: [
    {
      &quot;key&quot;: &quot;simple&quot;,
      &quot;label&quot;: &quot;Simple local agent&quot;,
      &quot;path&quot;: &quot;examples/simple-agent.yaml&quot;,
      &quot;source&quot;: &quot;apiVersion: reddiagent.dev/v0.1\nkind: Agent\nmetadata:\n  name: simple-research-helper\n  description: Answers a user question using only model reasoning and a session log.\nmodel:\n  capability: chat\n  providers:\n    preferred: openai\n    fallbacks:\n      - anthropic\n      - gemini\n      - ollama\n  requirements:\n    toolCalling: false\n    structuredOutput: true\nharness:\n  instructions:\n    inline: \&quot;Answer clearly. Say when you are uncertain. Do not use external tools.\&quot;\n  memory:\n    mode: session\n  policies:\n    - id: no-external-actions\n      type: permission\n      rule: \&quot;The agent may not send messages, spend money, browse, or modify files.\&quot;\n  evalGates:\n    - id: has-answer\n      type: output-check\n      rule: \&quot;Response must include an answer or a clear uncertainty statement.\&quot;\n  runtime:\n    target: local-python\nextensions: {}\n\n&quot;,
      &quot;validation&quot;: {
        &quot;status&quot;: &quot;pass&quot;,
        &quot;errorCount&quot;: 0,
        &quot;errors&quot;: []
      }
    },
    {
      &quot;key&quot;: &quot;tool&quot;,
      &quot;label&quot;: &quot;Tool fixture agent&quot;,
      &quot;path&quot;: &quot;examples/tool-agent.yaml&quot;,
      &quot;source&quot;: &quot;apiVersion: reddiagent.dev/v0.1\nkind: Agent\nmetadata:\n  name: source-checker\n  description: Answers questions using one approved search tool and cites the source title.\nmodel:\n  capability: chat\n  providers:\n    preferred: anthropic\n    fallbacks:\n      - openai\n      - gemini\n  requirements:\n    toolCalling: true\n    structuredOutput: true\nharness:\n  instructions:\n    inline: \&quot;Use the search_docs tool before answering factual questions. Cite source titles.\&quot;\n  tools:\n    - id: search_docs\n      type: function\n      description: Search approved documentation sources.\n      inputSchema:\n        type: object\n        properties:\n          query:\n            type: string\n        required:\n          - query\n      outputSchema:\n        type: object\n        properties:\n          title:\n            type: string\n          url:\n            type: string\n          snippet:\n            type: string\n  toolFixtures:\n    - toolId: search_docs\n      args:\n        query: tool registry\n  policies:\n    - id: approved-sources-only\n      type: data-access\n      rule: \&quot;Tool may only search configured approved documentation sources.\&quot;\n  evalGates:\n    - id: cite-source\n      type: output-check\n      rule: \&quot;Answer must include at least one source title.\&quot;\n  runtime:\n    target: local-python\nextensions: {}\n&quot;,
      &quot;validation&quot;: {
        &quot;status&quot;: &quot;pass&quot;,
        &quot;errorCount&quot;: 0,
        &quot;errors&quot;: []
      }
    },
    {
      &quot;key&quot;: &quot;payment&quot;,
      &quot;label&quot;: &quot;Payment metadata agent&quot;,
      &quot;path&quot;: &quot;examples/payment-agent.yaml&quot;,
      &quot;source&quot;: &quot;apiVersion: reddiagent.dev/v0.1\nkind: Agent\nmetadata:\n  name: paid-specialist-researcher\n  description: Performs a bounded paid research task and emits a receipt.\nmodel:\n  capability: chat\n  providers:\n    preferred: openai\n    fallbacks:\n      - anthropic\n  requirements:\n    toolCalling: true\n    structuredOutput: true\nharness:\n  instructions:\n    inline: \&quot;Complete the task within budget, use approved tools only, and emit receipt metadata.\&quot;\n  tools:\n    - id: fetch_approved_url\n      type: function\n      description: Fetch one approved URL.\n  policies:\n    - id: task-budget\n      type: budget\n      rule: \&quot;Total task spend must be less than or equal to 0.25 USDC.\&quot;\n    - id: human-approval\n      type: approval\n      rule: \&quot;Ask for approval before any payment above 1.00 USDC.\&quot;\n  evalGates:\n    - id: receipt-required\n      type: receipt-check\n      rule: \&quot;A task receipt must be emitted before completion.\&quot;\n  runtime:\n    target: hosted-container\nextensions:\n  x402:\n    enabled: true\n    intents:\n      - id: pay-specialist\n        direction: spend\n        maxAmount: \&quot;0.25\&quot;\n        currency: USDC\n        rails:\n          - solana\n          - base\n          - stripe\n        requireReceipt: true\n  receipts:\n    required: true\n  reputation:\n    emitSignals:\n      - taskCompleted\n      - evalPassed\n      - receiptVerified\n\n&quot;,
      &quot;validation&quot;: {
        &quot;status&quot;: &quot;pass&quot;,
        &quot;errorCount&quot;: 0,
        &quot;errors&quot;: []
      }
    },
    {
      &quot;key&quot;: &quot;invalid-missing-instructions&quot;,
      &quot;label&quot;: &quot;Invalid: missing instructions&quot;,
      &quot;path&quot;: &quot;examples/invalid/missing-instructions.yaml&quot;,
      &quot;source&quot;: &quot;apiVersion: reddiagent.dev/v0.1\nkind: Agent\nmetadata:\n  name: invalid-missing-instructions\n  description: Missing harness instructions for validation demo.\nmodel:\n  capability: chat\n  providers:\n    preferred: openai\n  requirements:\n    toolCalling: false\n    structuredOutput: true\nharness:\n  runtime:\n    target: local-python\nextensions: {}\n\n&quot;,
      &quot;validation&quot;: {
        &quot;status&quot;: &quot;fail&quot;,
        &quot;errorCount&quot;: 1,
        &quot;errors&quot;: [
          {
            &quot;code&quot;: &quot;adl_v0_1_schema.required.harness_instructions&quot;,
            &quot;severity&quot;: &quot;error&quot;,
            &quot;category&quot;: &quot;schema&quot;,
            &quot;path&quot;: &quot;harness.instructions&quot;,
            &quot;line&quot;: 14,
            &quot;column&quot;: 3,
            &quot;location&quot;: &quot;harness.instructions&quot;,
            &quot;problem&quot;: &quot;Missing required field: harness.instructions.&quot;,
            &quot;why_it_matters&quot;: &quot;Instructions are the agent&#x27;s operating contract: what it may do, what it should avoid, and how it should behave.&quot;,
            &quot;fix&quot;: &quot;Add harness.instructions with either inline text or a path to an instruction file.&quot;,
            &quot;snippet&quot;: &quot;harness:\n  instructions:\n    inline: Summarize the supplied source and cite every claim.&quot;,
            &quot;reference&quot;: &quot;tutorials/simple-local-agent.md&quot;,
            &quot;raw_message&quot;: &quot;&#x27;instructions&#x27; is a required property&quot;
          }
        ]
      }
    }
  ]
}</script>
  <script>
    const manifest = JSON.parse(document.getElementById("adl-ui-manifest").textContent);
    const state = { mode: "example", activeKey: manifest.examples[0].key };
    const select = document.getElementById("example-select");
    const input = document.getElementById("adl-input");
    const results = document.getElementById("results");
    const statusEl = document.getElementById("validation-status");
    const sourceLabel = document.getElementById("source-label");
    const errorCount = document.getElementById("error-count");
    const runtimeFlag = document.getElementById("runtime-flag");
    const networkFlag = document.getElementById("network-flag");
    const guardrails = document.getElementById("guardrails");
    const exampleControls = document.getElementById("example-controls");
    const modeExample = document.getElementById("mode-example");
    const modePaste = document.getElementById("mode-paste");

    function activeExample() {
      return manifest.examples.find((item) => item.key === state.activeKey) || manifest.examples[0];
    }

    function setMode(mode) {
      state.mode = mode;
      modeExample.setAttribute("aria-pressed", String(mode === "example"));
      modePaste.setAttribute("aria-pressed", String(mode === "paste"));
      exampleControls.hidden = mode !== "example";
      if (mode === "example") {
        input.value = activeExample().source;
        renderValidation(activeExample().validation, activeExample().path);
      } else {
        sourceLabel.textContent = "Pasted ADL - prototype browser checks";
        renderValidation(validatePastedAdl(input.value), "pasted ADL");
      }
    }

    function renderGuardrails() {
      guardrails.innerHTML = "";
      Object.entries(manifest.guardrails).forEach(([key, value]) => {
        const item = document.createElement("div");
        item.innerHTML = `<strong>${key}</strong><br><code>${String(value)}</code>`;
        guardrails.appendChild(item);
      });
    }

    function renderValidation(validation, source) {
      const passed = validation.status === "pass";
      statusEl.className = `status ${validation.status}`;
      statusEl.textContent = passed ? "PASS" : "FAIL";
      sourceLabel.textContent = source;
      errorCount.textContent = String(validation.errorCount);
      runtimeFlag.textContent = String(manifest.guardrails.runtimeExecutionAllowed);
      networkFlag.textContent = String(manifest.guardrails.networkAccess);
      results.innerHTML = "";

      if (passed) {
        const ok = document.createElement("div");
        ok.className = "finding";
        ok.innerHTML = "<h3>Schema validation passed</h3><p>This view is local/static and does not run the agent.</p>";
        results.appendChild(ok);
        return;
      }

      validation.errors.forEach((finding) => {
        const node = document.createElement("div");
        node.className = "finding fail";
        node.innerHTML = `
          <h3>${finding.location || "ADL"}: ${finding.problem || "Validation finding"}</h3>
          <p><strong>Fix:</strong> ${finding.fix || "Update the ADL and rerun the local validator."}</p>
          <p><strong>Reference:</strong> <code>${finding.reference || manifest.schema}</code></p>
          <p>${finding.rationale || "The static UI keeps runtime behavior disabled."}</p>
        `;
        results.appendChild(node);
      });
    }

    function hasPattern(text, pattern) {
      return pattern.test(text);
    }

    function validatePastedAdl(text) {
      const findings = [];
      const checks = [
        ["apiVersion", /^apiVersion:\s*reddiagent\.dev\/v0\.1\s*$/m, "Set apiVersion to reddiagent.dev/v0.1."],
        ["kind", /^kind:\s*Agent\s*$/m, "Set kind to Agent."],
        ["metadata.name", /^\s{2}name:\s*[a-z0-9][a-z0-9-]{1,62}\s*$/m, "Use a lowercase kebab-case metadata.name."],
        ["metadata.description", /^\s{2}description:\s*\S/m, "Add a non-empty metadata.description."],
        ["model.capability", /^\s{2}capability:\s*(chat|reasoning|code|vision|audio|embedding|reranking)\s*$/m, "Use a supported model capability."],
        ["model.providers.preferred", /^\s{4}preferred:\s*\S/m, "Choose a preferred provider name as metadata only."],
        ["model.requirements", /^\s{2}requirements:\s*$/m, "Declare model requirements."],
        ["harness.instructions", /^\s{2}instructions:\s*$/m, "Add harness instructions."],
        ["harness.runtime.target", /^\s{4}target:\s*(local-python|hosted-container|serverless|platform-native|openclaw)\s*$/m, "Use a supported runtime target."],
      ];
      checks.forEach(([location, pattern, fix]) => {
        if (!hasPattern(text, pattern)) {
          findings.push({
            location,
            problem: "Missing or unsupported field in prototype check.",
            fix,
            reference: manifest.schema,
            rationale: "Browser checks are a local preview of the Python JSON Schema validator."
          });
        }
      });
      return { status: findings.length ? "fail" : "pass", errorCount: findings.length, errors: findings };
    }

    manifest.examples.forEach((item) => {
      const option = document.createElement("option");
      option.value = item.key;
      option.textContent = `${item.label} (${item.path})`;
      select.appendChild(option);
    });
    select.addEventListener("change", () => {
      state.activeKey = select.value;
      input.value = activeExample().source;
      renderValidation(activeExample().validation, activeExample().path);
    });
    modeExample.addEventListener("click", () => setMode("example"));
    modePaste.addEventListener("click", () => setMode("paste"));
    document.getElementById("validate-button").addEventListener("click", () => {
      if (state.mode === "example" && input.value === activeExample().source) {
        renderValidation(activeExample().validation, activeExample().path);
      } else {
        setMode("paste");
      }
    });
    input.value = activeExample().source;
    renderGuardrails();
    renderValidation(activeExample().validation, activeExample().path);
  </script>
</body>
</html>
